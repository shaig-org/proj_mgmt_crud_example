<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scenario Evidence Gallery</title>
    <link rel="stylesheet" href="viewer.css" />
  </head>
  <body>
    <header class="app-header">
      <h1><a href="#/" class="home-link">Scenario Evidence</a></h1>
      <div class="meta" id="meta"></div>
    </header>
    <div id="app"></div>
    <div id="lightbox" class="lightbox hidden" role="dialog" aria-modal="true" aria-label="Screenshot lightbox">
      <button class="lightbox-close" data-lb-close="1" aria-label="Close">&times;</button>
      <button class="lightbox-nav lightbox-prev" data-lb-prev="1" aria-label="Previous">&#10094;</button>
      <button class="lightbox-nav lightbox-next" data-lb-next="1" aria-label="Next">&#10095;</button>
      <figure class="lightbox-figure">
        <img id="lightbox-img" alt="" />
        <figcaption id="lightbox-cap"></figcaption>
      </figure>
    </div>
    <script src="viewer.js" defer></script>
  </body>
</html>
