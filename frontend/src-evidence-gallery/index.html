<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scenario Evidence Gallery</title>
    <link rel="stylesheet" href="viewer.css" />
  </head>
  <body>
    <header class="app-header">
      <h1>Scenario Evidence</h1>
      <div class="meta" id="meta"></div>
    </header>
    <div class="layout">
      <aside class="sidebar">
        <section>
          <h2>Search</h2>
          <input id="search" type="search" placeholder="Search scenarios..." />
        </section>
        <section>
          <h2>Feature</h2>
          <ul id="feature-list"></ul>
        </section>
      </aside>
      <main class="grid" id="grid"></main>
    </div>
    <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
      <div class="modal-backdrop" data-close="1"></div>
      <div class="modal-content">
        <button class="modal-close" data-close="1" aria-label="Close">&times;</button>
        <div id="modal-body"></div>
      </div>
    </div>
    <script src="viewer.js" defer></script>
  </body>
</html>
