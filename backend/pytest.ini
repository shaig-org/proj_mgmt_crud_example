# Using pytest.ini and not pyproject.toml because pytest-watch crashes if there is no pytest.ini.

[pytest]
# Quiet default: concise on pass, short tracebacks on fail. Keeps agent context tight.
# Override with -v / -vv / --tb=long on the CLI when debugging.
#
# NOTE on parallelism: xdist is *not* enabled by default here because it adds
# ~2s worker-startup overhead, which dominates runtime for single-file agent
# iteration. Full-suite runners (run_all_agent_validations.sh / run_tests.sh)
# pass `-n auto --dist loadfile` explicitly to parallelize the 900+ tests
# across workers. Use `-n auto --dist loadfile` on the CLI for a parallel
# full-suite run outside those scripts.
addopts = -q --tb=short
# Treating all warnings as errors, since there are no specific warnings that we actually need to live with.
filterwarnings =
    error
    ignore::jwt.warnings.InsecureKeyLengthWarning
markers =
    scenario: mark test as a pytest-tracer scenario
    behavior(name): categorize pytest-tracer scenario with a behavior tag
    error: pytest-tracer scenario that exercises an error case
